services:
  bot:
    build:
      context: .
    container_name: plural-tts-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:/data/plural-tts.db
      TTS_PROVIDER: piper-http
      PIPER_URL: http://piper:8080
    volumes:
      - plural-tts-data:/data
    depends_on:
      piper:
        condition: service_healthy

  piper:
    build:
      context: ./docker/piper-http
    container_name: plural-tts-piper
    restart: unless-stopped
    environment:
      PIPER_MODEL_PATH: /models/piper/en_GB/northern_english_male/medium/en_GB-northern_english_male-medium.onnx
      PIPER_VOICE_CATALOG_PATH: /models/piper/models.json
      PIPER_DEFAULT_VOICE_ID: ${DEFAULT_VOICE_ID:-en_GB-northern_english_male-medium}
      PIPER_TIMEOUT_SECONDS: "30"
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:18950:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  plural-tts-data:
